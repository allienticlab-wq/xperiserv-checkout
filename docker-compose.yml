version: "3.9"

services:
  allientic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allientic-checkout-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - allientic-net

  postgres:
    image: postgres:16-alpine
    container_name: allientic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-allientic_checkout}
      POSTGRES_USER: ${SQL_ADMIN_USER:-allientic_admin}
      POSTGRES_PASSWORD: ${SQL_ADMIN_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_ADMIN_USER:-allientic_admin} -d ${SQL_DB_NAME:-allientic_checkout}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allientic-net

  redis:
    image: redis:7-alpine
    container_name: allientic-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allientic-net

  nginx:
    image: nginx:1.27-alpine
    container_name: allientic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/checkout.xperiserv.in.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - allientic-app
    networks:
      - allientic-net

volumes:
  pgdata:
  redisdata:

networks:
  allientic-net:
    driver: bridge
