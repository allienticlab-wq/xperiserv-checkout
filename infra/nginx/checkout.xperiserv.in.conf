# Nginx Reverse Proxy Configuration for https://checkout.xperiserv.in
# Allientic Lab Technologies

limit_req_zone $binary_remote_addr zone=checkout_api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name checkout.xperiserv.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name checkout.xperiserv.in;

    ssl_certificate /etc/letsencrypt/live/checkout.xperiserv.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.xperiserv.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/v1/ {
        limit_req zone=checkout_api_limit burst=30 nodelay;
        proxy_pass http://allientic-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://allientic-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
